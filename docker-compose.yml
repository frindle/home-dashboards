services:
  ev-dashboard:
    build:
      context: .
      args:
        BUILD_SHA: "${BUILD_SHA:-unknown}"
    networks:
      br0:
        ipv4_address: ${EV_IPV4:?set EV_IPV4 in .env}
    mac_address: "${EV_MAC:?set EV_MAC in .env}"
    volumes:
      - /mnt/user/appdata/ev-dashboard/keys:/app/keys
    environment:
      - KEYS_DIR=/app/keys
      - TELEMETRY_PORT=50051
      - TESLA_LOG_API_BODIES=1
      # NV Energy TOU/EVRR buckets and daily charts use local time (getHours/toLocaleDateString)
      - TZ=America/Los_Angeles
      # InfluxDB dual-write — set these (values live in .env, not here) to turn
      # on the telemetry->InfluxDB write path in server/telemetry-server.js.
      # All four required; any unset => disabled (no-op). See .env.example.
      # - INFLUX_URL=http://<influx-host>:8086
      # - INFLUX_TOKEN=...
      # - INFLUX_ORG=...
      # - INFLUX_BUCKET=...
    env_file:
      - .env
    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/frindle/home-dashboards/main/icon.png"
    restart: unless-stopped

networks:
  br0:
    external: true
