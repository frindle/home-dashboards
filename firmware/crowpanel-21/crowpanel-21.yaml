# Status panel for the Elecrow CrowPanel Rotary 2.1" (ESP32-S3R8). See README.md.
# Hardware blocks (psram, i2c, pcf8574, st7701s init, cst816, encoder) are from Elecrow's ESPHome lesson 05.
# The screens are drawn from firmware/crowpanel-21/panel_*.h: panel_feed.h (parser), panel_nav.h (knob and red
# auto-switch), panel_view.h (text per screen), panel_ui.h (LVGL). test/panel_test.cpp runs them on a normal machine.
substitutions:
  # Knob feel. Counts per step: raise it if one click skips a screen. Direction: 1 clockwise = next, -1 reverses it.
  knob_counts_per_step: "1"
  knob_direction: "1"
  poll_every: 10s

esphome:
  name: crowpanel-21
  friendly_name: Status Panel
  includes:
    - panel_feed.h
    - panel_nav.h
    - panel_view.h
    - panel_ui.h
    - panel_helpers.h
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio
  on_boot:
    priority: 800
    then:
      - output.turn_on: touch_int_release
      - output.turn_on: lcd_power
      - output.turn_on: display_reset
      - delay: 100ms
      - output.turn_off: display_reset
      - delay: 600ms
      - light.turn_on:
          id: display_backlight
          brightness: 60%

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

# improv_serial shares the USB serial port with the logger, so keep the level low to leave the port quiet.
logger:
  level: WARN

# No Home Assistant needed; the API stays off. OTA stays on.
ota:
  - platform: esphome
    password: !secret ota_password

# Wi-Fi is NOT in the firmware. First boot (or after the saved network fails): connect a computer to USB and use
# the improv Wi-Fi setup in the ESPHome web installer, or join the "crowpanel-21 setup" hotspot and use the captive
# page. The network is then saved on the device and survives OTA updates.
wifi:
  ap:
    ssid: "crowpanel-21 setup"
    password: !secret ap_password

captive_portal:

improv_serial:

time:
  - platform: sntp
    id: sntp_time
    timezone: America/Los_Angeles

http_request:
  id: http
  timeout: 4s
  verify_ssl: false          # the panel route is plain http on the LAN
  buffer_size_rx: 4096
  buffer_size_tx: 512

i2c:
  sda: GPIO38
  scl: GPIO39
  id: bus_a
  scan: false

pcf8574:
  - id: pcf
    address: 0x21

output:
  - platform: ledc
    pin: 6
    id: bl_pwm
    frequency: 19531Hz
  - platform: gpio
    id: touch_int_release
    pin: {pcf8574: pcf, number: 2, mode: {output: true}, inverted: false}
  - platform: gpio
    id: lcd_power
    pin: {pcf8574: pcf, number: 3, mode: {output: true}, inverted: false}
  - platform: gpio
    id: display_reset
    pin: {pcf8574: pcf, number: 4, mode: {output: true}, inverted: true}

light:
  - platform: monochromatic
    name: "LCD Backlight"
    output: bl_pwm
    id: display_backlight
    default_transition_length: 0s
    restore_mode: ALWAYS_ON

globals:
  - {id: last_enc, type: int, restore_value: false, initial_value: "0"}
  - {id: enc_ready, type: bool, restore_value: false, initial_value: "false"}
  - {id: enc_acc, type: int, restore_value: false, initial_value: "0"}
  - {id: last_br, type: int, restore_value: false, initial_value: "-1"}

binary_sensor:
  # Encoder press: PCF8574 P5, input with pull-up, active low.
  - platform: gpio
    id: knob_press
    internal: true
    pin: {pcf8574: pcf, number: 5, mode: {input: true}, inverted: true}
    filters:
      - delayed_on: 30ms
    # Short press: detail, or "open this alert's topic" inside the alert view. Long press (hold about a second):
    # open the alert view from any screen, or leave it. Both act on release.
    on_click:
      - min_length: 40ms
        max_length: 600ms
        then:
          - lambda: panel::on_press(panel::g_nav, panel::g_feed, millis());
          - script.execute: refresh_ui
      - min_length: 800ms
        max_length: 10s
        then:
          - lambda: panel::on_long_press(panel::g_nav, panel::g_feed, millis());
          - script.execute: refresh_ui

sensor:
  - platform: rotary_encoder
    id: knob
    internal: true
    pin_a: {number: 42, mode: {input: true, pullup: true}}
    pin_b: {number: 4, mode: {input: true, pullup: true}}
    resolution: 1
    filters:
      - debounce: 20ms
    on_value:
      then:
        - lambda: |-
            int cur = (int) x;
            if (!id(enc_ready)) { id(last_enc) = cur; id(enc_ready) = true; return; }
            id(enc_acc) += (cur - id(last_enc)) * ${knob_direction};
            id(last_enc) = cur;
            int step = 0;
            while (id(enc_acc) >= ${knob_counts_per_step}) { id(enc_acc) -= ${knob_counts_per_step}; step++; }
            while (id(enc_acc) <= -${knob_counts_per_step}) { id(enc_acc) += ${knob_counts_per_step}; step--; }
            if (step == 0) return;
            panel::on_rotate(panel::g_nav, panel::g_feed, step > 0 ? 1 : -1, millis());
        - script.execute: refresh_ui

script:
  # Draws the current screen. Cheap: only changed widgets are touched. Runs after every knob event, feed and tick.
  - id: refresh_ui
    mode: restart
    then:
      - lambda: |-
          static panel::View v;
          panel::Clock c;
          auto t = id(sntp_time).now();
          if (t.is_valid()) {
            c.valid = true;
            snprintf(c.time, sizeof c.time, "%s", t.strftime("%H:%M").c_str());
            snprintf(c.date, sizeof c.date, "%s", t.strftime("%a %d %b").c_str());
          }
          uint32_t now = millis();
          panel::make_view(panel::g_feed, panel::g_nav, c, now, v);
          panel::Widgets w{id(w_title), id(w_big), id(w_bar), {id(w_l0), id(w_l1), id(w_l2), id(w_l3)}, id(w_foot), id(ring), id(w_badge)};
          panel::apply(w, v);
          int b = panel::brightness(panel::g_feed, panel::g_nav, now);
          if (b != id(last_br)) {
            id(last_br) = b;
            auto call = id(display_backlight).make_call();
            call.set_state(true);
            call.set_brightness(b / 100.0f);
            call.set_transition_length(0);
            call.perform();
          }

spi:
  clk_pin: 2
  mosi_pin: 1

display:
  - platform: st7701s
    id: my_display
    auto_clear_enabled: false
    update_interval: never
    spi_mode: MODE3
    color_order: RGB
    invert_colors: false
    dimensions: {width: 480, height: 480}
    cs_pin: 16
    de_pin: 40
    hsync_pin: 15
    vsync_pin: 7
    pclk_pin: 41
    data_pins:
      red: [46, 3, 8, 18, 17]
      green: [14, 13, 12, 11, 10, 9]
      blue: [5, 45, 48, 47, 21]
    hsync_front_porch: 20
    hsync_pulse_width: 10
    hsync_back_porch: 10
    vsync_front_porch: 8
    vsync_pulse_width: 10
    vsync_back_porch: 10
    pclk_frequency: 18MHz
    pclk_inverted: true
    init_sequence:
      - [0x01]
      - delay 120ms
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xC0, 0x3B, 0x00]
      - [0xC1, 0x0B, 0x02]
      - [0xC2, 0x00, 0x02]
      - [0xCC, 0x10]
      - [0xCD, 0x08]
      - [0xB0, 0x02, 0x13, 0x1B, 0x0D, 0x10, 0x05, 0x08, 0x07, 0x07, 0x24, 0x04, 0x11, 0x0E, 0x2C, 0x33, 0x1D]
      - [0xB1, 0x05, 0x13, 0x1B, 0x0D, 0x11, 0x05, 0x08, 0x07, 0x07, 0x24, 0x04, 0x11, 0x0E, 0x2C, 0x33, 0x1D]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x11]
      - [0xB0, 0x5d]
      - [0xB1, 0x43]
      - [0xB2, 0x81]
      - [0xB3, 0x80]
      - [0xB5, 0x43]
      - [0xB7, 0x85]
      - [0xB8, 0x20]
      - [0xC1, 0x78]
      - [0xC2, 0x78]
      - [0xD0, 0x88]
      - [0xE0, 0x00, 0x00, 0x02]
      - [0xE1, 0x03, 0xA0, 0x00, 0x00, 0x04, 0xA0, 0x00, 0x00, 0x00, 0x20, 0x20]
      - [0xE2, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xE3, 0x00, 0x00, 0x11, 0x00]
      - [0xE4, 0x22, 0x00]
      - [0xE5, 0x05, 0xEC, 0xA0, 0xA0, 0x07, 0xEE, 0xA0, 0xA0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xE6, 0x00, 0x00, 0x11, 0x00]
      - [0xE7, 0x22, 0x00]
      - [0xE8, 0x06, 0xED, 0xA0, 0xA0, 0x08, 0xEF, 0xA0, 0xA0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xEB, 0x00, 0x00, 0x40, 0x40, 0x00, 0x00, 0x00]
      - [0xEd, 0xFF, 0xFF, 0xFF, 0xBA, 0x0A, 0xBF, 0x45, 0xFF, 0xFF, 0x54, 0xFB, 0xA0, 0xAB, 0xFF, 0xFF, 0xFF]
      - [0xEF, 0x10, 0x0D, 0x04, 0x08, 0x3F, 0x1F]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x13]
      - [0xEF, 0x08]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x00]
      - [0x36, 0x08]
      - [0x3A, 0x60]
      - [0x11]
      - delay 100ms
      - [0x29]
      - delay 50ms

touchscreen:
  - platform: cst816
    id: touch_panel
    display: my_display
    reset_pin: {pcf8574: pcf, number: 0, mode: {output: true}, inverted: false}
    update_interval: 50ms

interval:
  - interval: ${poll_every}
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - http_request.get:
                url: !secret panel_url
                capture_response: true
                max_response_buffer_size: 6144
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) return;
                        bool good = false;
                        json::parse_json(body, [&good](JsonObject root) -> bool {
                          good = panel::parse_feed(root, panel::g_feed, millis());
                          return good;
                        });
                        if (good) panel::on_feed(panel::g_nav, panel::g_feed, millis());
                    - script.execute: refresh_ui
                # A failed poll keeps the last good body; make_view hides it as "no link" after 75 s.
                on_error:
                  then:
                    - script.execute: refresh_ui

  - interval: 1s
    then:
      - lambda: panel::on_tick(panel::g_nav, panel::g_feed, millis());
      - script.execute: refresh_ui

lvgl:
  displays: [my_display]
  touchscreens:
    - touchscreen_id: touch_panel
  buffer_size: 50%
  top_layer:
    widgets:
      # Ring around the edge: blue ok, amber attention, red act, dark grey when there is no link.
      - obj:
          id: ring
          align: CENTER
          width: 480
          height: 480
          radius: 240
          bg_opa: TRANSP
          border_width: 14
          border_color: 0x606060
          clickable: false
          scrollable: false
  pages:
    - id: p_main
      bg_color: 0x000000
      widgets:
        - label: {id: w_title, align: CENTER, y: -168, width: 360, text_align: CENTER, long_mode: CLIP, text: "", text_font: montserrat_20, text_color: 0x4DA3FF}
        - label: {id: w_big, align: CENTER, y: -105, width: 380, text_align: CENTER, long_mode: CLIP, text: "WAIT", text_font: montserrat_48, text_color: 0xFFFFFF}
        - bar:
            id: w_bar
            align: CENTER
            y: -62
            width: 240
            height: 8
            min_value: 0
            max_value: 100
            value: 0
            hidden: true
            bg_color: 0x202020
            indicator: {bg_color: 0x4DA3FF}
        - label: {id: w_l0, align: CENTER, y: -25, width: 390, text_align: CENTER, long_mode: CLIP, text: "", text_font: montserrat_20, text_color: 0xFFFFFF}
        - label: {id: w_l1, align: CENTER, y: 17, width: 390, text_align: CENTER, long_mode: CLIP, text: "", text_font: montserrat_20, text_color: 0xA0A6B0}
        - label: {id: w_l2, align: CENTER, y: 59, width: 390, text_align: CENTER, long_mode: CLIP, text: "", text_font: montserrat_20, text_color: 0xA0A6B0}
        - label: {id: w_l3, align: CENTER, y: 101, width: 390, text_align: CENTER, long_mode: CLIP, text: "", text_font: montserrat_20, text_color: 0xA0A6B0}
        # Alert badge: a pill at the top edge, above the title, so it never covers the page data.
        - label:
            id: w_badge
            align: CENTER
            y: -204
            width: 116
            height: 26
            hidden: true
            text_align: CENTER
            long_mode: CLIP
            text: ""
            text_font: montserrat_16
            text_color: 0xFFFFFF
            bg_color: 0xFF3B30
            bg_opa: COVER
            radius: 13
            pad_top: 3
        - label: {id: w_foot, align: CENTER, y: 160, width: 320, text_align: CENTER, long_mode: CLIP, text: "", text_font: montserrat_16, text_color: 0xA0A6B0}
